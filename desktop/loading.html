<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <title>知页 Paperleaf</title>
    <style>
      body {
        margin: 0;
        background: #faf9f6;
        color: #49624f;
        font:
          14px 'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .intro {
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 22px;
      }
      h1 {
        font-family: Georgia, 'SimSun', serif;
        font-size: 31px;
        letter-spacing: 5px;
        font-weight: 400;
      }
      p {
        color: #929e85;
        font-size: 12px;
        line-height: 2;
      }
      .dot {
        height: 4px;
        width: 50px;
        border-radius: 8px;
        background: #dce4d1;
        margin: 25px auto;
        overflow: hidden;
      }
      .dot:after {
        content: '';
        display: block;
        height: 100%;
        width: 20px;
        background: #8fa374;
        animation: move 1.3s infinite ease-in-out;
      }
      @keyframes move {
        50% {
          transform: translateX(30px);
        }
      }
      small {
        color: #adb6a2;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <img src="assets/icon.png" alt="知页图标" />
      <h1>知页 Paperleaf</h1>
      <p>先读懂，再深入。</p>
      <div class="dot"></div>
      <p>正在打开你的本地阅读空间…</p>
      <small>文献和笔记始终保存在这台电脑上</small>
    </div>
  </body>
</html>
